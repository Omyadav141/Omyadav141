<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Rolling up to the desk and shipping code</title>
  <desc id="dsc">Animated illustration of a developer who rolls up to a desk in a wheelchair and starts typing while code and a training chart appear on the monitor.</desc>

  <defs>
    <linearGradient id="pnl" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#58a6ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2740"/>
      <stop offset="1" stop-color="#08111c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f66"/>
      <stop offset="0.4" stop-color="#a8714b"/>
      <stop offset="1" stop-color="#89573a"/>
    </linearGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3546" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#2b3546"/>
      <stop offset="1" stop-color="#2b3546" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pclip"><rect x="0" y="0" width="800" height="300" rx="18"/></clipPath>
    <clipPath id="sclip"><rect x="538" y="52" width="166" height="100" rx="4"/></clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="300" rx="18" fill="url(#pnl)"/>

  <g clip-path="url(#pclip)">

    <!-- window chrome -->
    <circle cx="26" cy="22" r="4" fill="#ff7b72" opacity=".8"/>
    <circle cx="42" cy="22" r="4" fill="#e3b341" opacity=".8"/>
    <circle cx="58" cy="22" r="4" fill="#7ee787" opacity=".8"/>
    <text x="76" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#4a5568">deep-work.session</text>

    <!-- monitor light spill -->
    <ellipse cx="618" cy="110" rx="220" ry="142" fill="url(#spill)"/>

    <!-- wall frame with training curve -->
    <g opacity="0.9">
      <rect x="150" y="58" width="106" height="74" rx="5" fill="#0e1523" stroke="#2b3546" stroke-width="2"/>
      <path d="M162 118 L178 106 L192 108 L206 92 L222 86 L244 72" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" values="120;0;0;120" keyTimes="0;0.35;0.85;1" dur="7s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <circle cx="244" cy="72" r="3" fill="#7ee787" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.4;0.85;1" dur="7s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="162" y="124" width="40" height="3" rx="1.5" fill="#30363d"/>
    </g>

    <!-- floor -->
    <rect x="0" y="255" width="800" height="2" fill="url(#gnd)"/>

    <!-- desk -->
    <rect x="430" y="190" width="268" height="5" rx="2" fill="#7b4e33" opacity=".75"/>
    <rect x="700" y="190" width="56" height="66" rx="3" fill="#95643f"/>
    <rect x="707" y="200" width="42" height="16" rx="3" fill="#8a5a38" stroke="#6f462b" stroke-width="1"/>
    <rect x="707" y="222" width="42" height="16" rx="3" fill="#8a5a38" stroke="#6f462b" stroke-width="1"/>
    <rect x="722" y="207" width="12" height="2.5" rx="1.2" fill="#d8b394"/>
    <rect x="722" y="229" width="12" height="2.5" rx="1.2" fill="#d8b394"/>
    <rect x="398" y="180" width="362" height="10" rx="3" fill="url(#wood)"/>
    <rect x="398" y="180" width="362" height="2.5" rx="1.2" fill="#d8a87d" opacity=".75"/>

    <!-- monitor -->
    <rect x="584" y="175" width="72" height="5" rx="2.5" fill="#39424f"/>
    <rect x="610" y="166" width="20" height="10" fill="#2f3a48"/>
    <rect x="530" y="44" width="182" height="122" rx="9" fill="#1b2430" stroke="#333f4f" stroke-width="2"/>
    <rect x="538" y="52" width="166" height="100" rx="4" fill="url(#scr)"/>
    <circle cx="620" cy="159" r="2.2" fill="#7ee787">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <g clip-path="url(#sclip)">
      <!-- editor chrome -->
      <circle cx="548" cy="62" r="2.2" fill="#ff7b72" opacity=".85"/>
      <circle cx="556" cy="62" r="2.2" fill="#e3b341" opacity=".85"/>
      <circle cx="564" cy="62" r="2.2" fill="#7ee787" opacity=".85"/>
      <rect x="572" y="60" width="34" height="4" rx="2" fill="#30363d"/>
      <!-- code lines -->
      <rect x="546" y="76" height="4.5" rx="2.2" width="0" fill="#d2a8ff">
        <animate attributeName="width" values="0;84;84;0;0" keyTimes="0;0.07;0.86;0.9;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="546" y="88" height="4.5" rx="2.2" width="0" fill="#79c0ff">
        <animate attributeName="width" values="0;62;62;0;0" keyTimes="0;0.07;0.86;0.9;1" dur="9s" begin="2.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="554" y="100" height="4.5" rx="2.2" width="0" fill="#8b949e">
        <animate attributeName="width" values="0;74;74;0;0" keyTimes="0;0.07;0.86;0.9;1" dur="9s" begin="3.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="554" y="112" height="4.5" rx="2.2" width="0" fill="#7ee787">
        <animate attributeName="width" values="0;52;52;0;0" keyTimes="0;0.07;0.86;0.9;1" dur="9s" begin="3.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="562" y="124" height="4.5" rx="2.2" width="0" fill="#79c0ff">
        <animate attributeName="width" values="0;66;66;0;0" keyTimes="0;0.07;0.86;0.9;1" dur="9s" begin="4.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="546" y="136" height="4.5" rx="2.2" width="0" fill="#d2a8ff">
        <animate attributeName="width" values="0;44;44;0;0" keyTimes="0;0.07;0.86;0.9;1" dur="9s" begin="4.5s" repeatCount="indefinite"/>
      </rect>
      <!-- caret -->
      <rect x="594" y="135" width="5" height="7" fill="#c9d1d9" opacity="0">
        <animate attributeName="opacity" values="0;1;0;1;0;1;0" dur="2.4s" begin="4.6s" repeatCount="indefinite"/>
      </rect>
      <!-- training bars -->
      <g opacity=".75">
        <rect x="640" y="140" width="9" height="0" rx="2" fill="#7ee787">
          <animate attributeName="height" values="0;16;16;0;0" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="3.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="140;124;124;140;140" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="3.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="654" y="140" width="9" height="0" rx="2" fill="#7ee787">
          <animate attributeName="height" values="0;27;27;0;0" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="3.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="140;113;113;140;140" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="3.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="668" y="140" width="9" height="0" rx="2" fill="#79c0ff">
          <animate attributeName="height" values="0;21;21;0;0" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="3.7s" repeatCount="indefinite"/>
          <animate attributeName="y" values="140;119;119;140;140" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="3.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="682" y="140" width="9" height="0" rx="2" fill="#79c0ff">
          <animate attributeName="height" values="0;34;34;0;0" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="140;106;106;140;140" keyTimes="0;0.14;0.86;0.9;1" dur="9s" begin="4s" repeatCount="indefinite"/>
        </rect>
        <rect x="634" y="142" width="62" height="1.5" rx="0.75" fill="#30363d"/>
      </g>
    </g>

    <!-- keyboard -->
    <rect x="412" y="171" width="96" height="9" rx="3" fill="#39424f"/>
    <rect x="412" y="171" width="96" height="3" rx="1.5" fill="#4c586a"/>
    <g fill="#6e7681" opacity=".7">
      <rect x="418" y="175" width="10" height="2" rx="1"/>
      <rect x="432" y="175" width="10" height="2" rx="1"/>
      <rect x="446" y="175" width="10" height="2" rx="1"/>
      <rect x="460" y="175" width="10" height="2" rx="1"/>
      <rect x="474" y="175" width="10" height="2" rx="1"/>
      <rect x="488" y="175" width="14" height="2" rx="1"/>
    </g>

    <!-- mug -->
    <g>
      <path d="M746 162 q10 2 10 8 t-10 8" fill="none" stroke="#e0824a" stroke-width="3.5"/>
      <rect x="720" y="158" width="26" height="22" rx="4" fill="#f0883e"/>
      <rect x="720" y="158" width="26" height="4" rx="2" fill="#ffb086"/>
      <g stroke="#8b949e" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M728 152 q-4 -7 0 -13" opacity="0">
          <animate attributeName="opacity" values="0;0.55;0" dur="3.6s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="3.6s" repeatCount="indefinite"/>
        </path>
        <path d="M738 152 q4 -7 0 -13" opacity="0">
          <animate attributeName="opacity" values="0;0.5;0" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- ============ WHEELCHAIR + DEVELOPER ============ -->
    <g transform="translate(362,256)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-430 0;0 0" keyTimes="0;1" calcMode="spline" keySplines="0.12 0.72 0.16 1" dur="2.4s" fill="freeze"/>

        <!-- contact shadow -->
        <ellipse cx="14" cy="-2" rx="74" ry="7" fill="#070b12" opacity=".9"/>

        <!-- far wheel -->
        <g transform="translate(-8,-33)" opacity=".65">
          <circle r="32" fill="none" stroke="#1b2430" stroke-width="6"/>
          <circle r="25" fill="none" stroke="#2b3546" stroke-width="2"/>
        </g>

        <!-- backrest -->
        <rect x="-41" y="-110" width="11" height="52" rx="5" fill="#2b3240" transform="rotate(-7 -35 -84)"/>
        <path d="M-33 -58 C-38 -74 -40 -92 -41 -108" fill="none" stroke="#58a6ff" stroke-width="5" stroke-linecap="round"/>
        <path d="M-41 -108 q-2 -8 -13 -10" fill="none" stroke="#6e7681" stroke-width="5" stroke-linecap="round"/>

        <!-- frame -->
        <path d="M0 -33 L-20 -58" stroke="#58a6ff" stroke-width="5" stroke-linecap="round"/>
        <path d="M0 -33 L44 -24" stroke="#58a6ff" stroke-width="5" stroke-linecap="round"/>
        <path d="M-24 -58 L42 -58" stroke="#4c8ede" stroke-width="4" stroke-linecap="round"/>
        <path d="M44 -24 L48 -13" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>

        <!-- seat cushion -->
        <rect x="-32" y="-64" width="70" height="9" rx="4.5" fill="#39424f"/>

        <!-- far leg -->
        <g stroke="#2f3744" stroke-linecap="round" fill="none">
          <path d="M-4 -60 L38 -58" stroke-width="18"/>
          <path d="M38 -58 L48 -22" stroke-width="14"/>
        </g>
        <path d="M40 -24 h12 q9 0 9 6 v2 h-23 z" fill="#3d6fb0"/>

        <!-- far arm -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 14 -114;2.4 14 -114;0 14 -114;1.2 14 -114;0 14 -114" dur="0.86s" begin="2.6s" repeatCount="indefinite"/>
          <path d="M14 -114 L42 -95 L68 -88" fill="none" stroke="#9aa5b1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="72" cy="-87" r="6" fill="#d79f74"/>
        </g>

        <!-- torso -->
        <path d="M-6 -58 L20 -116" fill="none" stroke="#c9d1d9" stroke-width="30" stroke-linecap="round"/>
        <path d="M-2 -66 L14 -102" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity=".55"/>

        <!-- head -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 24 -122;1.4 24 -122;0 24 -122" dur="5.2s" begin="2.6s" repeatCount="indefinite"/>
          <path d="M20 -116 L26 -126" stroke="#e0aa7d" stroke-width="11" stroke-linecap="round"/>
          <circle cx="29" cy="-133" r="15" fill="#e8b98d"/>
          <path d="M15 -136 a15 15 0 0 1 27 -8 q-3 -12 -16 -11 -13 1 -13 13 z" fill="#3b2f26"/>
          <path d="M42 -144 q4 6 2 12" fill="none" stroke="#3b2f26" stroke-width="3" stroke-linecap="round"/>
          <circle cx="38" cy="-133" r="5.6" fill="#0d1117" fill-opacity=".25" stroke="#58a6ff" stroke-width="1.6"/>
          <path d="M32 -135 L24 -134" stroke="#58a6ff" stroke-width="1.4"/>
          <circle cx="38" cy="-133" r="1.7" fill="#2b2b31"/>
        </g>

        <!-- near leg -->
        <g stroke="#4a5568" stroke-linecap="round" fill="none">
          <path d="M-2 -56 L42 -55" stroke-width="20"/>
          <path d="M42 -55 L54 -20" stroke-width="15"/>
        </g>
        <path d="M46 -22 h13 q10 0 10 7 v2 h-25 z" fill="#58a6ff"/>

        <!-- footrest -->
        <rect x="42" y="-13" width="30" height="5" rx="2.5" fill="#4c586a"/>

        <!-- near arm -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 20 -116;1.2 20 -116;0 20 -116;2.4 20 -116;0 20 -116" dur="0.86s" begin="2.72s" repeatCount="indefinite"/>
          <path d="M20 -116 L50 -97 L90 -88" fill="none" stroke="#c9d1d9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="95" cy="-86" r="6.5" fill="#e8b98d"/>
        </g>

        <!-- near wheel -->
        <g transform="translate(0,-33)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 0 0;746 0 0" keyTimes="0;1" calcMode="spline" keySplines="0.12 0.72 0.16 1" dur="2.4s" fill="freeze"/>
            <g stroke="#8b949e" stroke-width="1.6" opacity=".85">
              <path d="M0 -24 L0 24"/>
              <path d="M-24 0 L24 0"/>
              <path d="M-17 -17 L17 17"/>
              <path d="M-17 17 L17 -17"/>
              <path d="M-9 -22 L9 22"/>
              <path d="M-22 -9 L22 9"/>
              <path d="M-22 9 L22 -9"/>
              <path d="M-9 22 L9 -22"/>
            </g>
            <circle r="5" fill="#c9d1d9"/>
            <circle r="2" fill="#39424f"/>
          </g>
          <circle r="32" fill="none" stroke="#30363d" stroke-width="7"/>
          <circle r="32" fill="none" stroke="#454f5e" stroke-width="1.5"/>
          <circle r="25" fill="none" stroke="#8b949e" stroke-width="2.5"/>
        </g>

        <!-- caster -->
        <g transform="translate(48,-11)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 0 0;2238 0 0" keyTimes="0;1" calcMode="spline" keySplines="0.12 0.72 0.16 1" dur="2.4s" fill="freeze"/>
            <g stroke="#8b949e" stroke-width="1.4">
              <path d="M0 -7 L0 7"/>
              <path d="M-7 0 L7 0"/>
            </g>
          </g>
          <circle r="10" fill="none" stroke="#30363d" stroke-width="5"/>
          <circle r="2.6" fill="#c9d1d9"/>
        </g>
      </g>
    </g>

    <!-- floor plant (foreground, left) -->
    <g transform="translate(98,256)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;1.4 0 0;0 0 0;-1.4 0 0;0 0 0" dur="9s" repeatCount="indefinite"/>
        <g fill="none" stroke="#238636" stroke-width="3" stroke-linecap="round">
          <path d="M0 -30 C-4 -56 -14 -70 -22 -84"/>
          <path d="M2 -30 C4 -60 6 -78 4 -96"/>
          <path d="M4 -30 C10 -54 20 -66 28 -76"/>
        </g>
        <g fill="#2ea043">
          <ellipse cx="-24" cy="-88" rx="13" ry="7" transform="rotate(-38 -24 -88)"/>
          <ellipse cx="4" cy="-102" rx="9" ry="15" fill="#3fb950"/>
          <ellipse cx="31" cy="-80" rx="14" ry="7" transform="rotate(32 31 -80)"/>
          <ellipse cx="-14" cy="-66" rx="11" ry="6" transform="rotate(-20 -14 -66)" fill="#3fb950"/>
          <ellipse cx="18" cy="-58" rx="11" ry="6" transform="rotate(18 18 -58)"/>
        </g>
      </g>
      <path d="M-20 -30 h40 l-6 30 h-28 z" fill="#8d5c3c"/>
      <rect x="-23" y="-34" width="46" height="7" rx="3" fill="#a8714b"/>
    </g>

    <!-- floating data motes -->
    <g fill="#58a6ff">
      <circle cx="470" cy="140" r="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 10;-6 -52" dur="5s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="150" r="1.6" fill="#7ee787" opacity="0">
        <animate attributeName="opacity" values="0;0.85;0" dur="6s" begin="4.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;8 -58" dur="6s" begin="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="524" cy="146" r="1.8" fill="#d2a8ff" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0" dur="5.6s" begin="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 8;-4 -50" dur="5.6s" begin="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- terminal caption -->
    <text x="28" y="284" textLength="286" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6e7681">~/om-yadav $ python train.py --epochs 100</text>
    <rect x="320" y="274" width="6" height="12" fill="#7ee787">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="798" height="298" rx="18" fill="none" stroke="#263041" stroke-width="2"/>
</svg>
