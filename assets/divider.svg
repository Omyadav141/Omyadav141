<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21262d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2b3546"/>
      <stop offset="1" stop-color="#21262d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#d2a8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d2a8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="line"><rect x="0" y="3" width="900" height="2" rx="1"/></clipPath>
  </defs>
  <rect x="0" y="3" width="900" height="2" rx="1" fill="url(#base)"/>
  <g clip-path="url(#line)">
    <rect x="-260" y="2" width="260" height="4" rx="2" fill="url(#pulse)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1170 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
