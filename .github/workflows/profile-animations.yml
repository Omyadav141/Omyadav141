name: profile-animations

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: false

env:
  GH_USER: Omyadav141

jobs:
  build:
    name: Rebuild avatar, cards and snake
    runs-on: ubuntu-latest
    steps:
      # THIS was missing before. Without a checkout the snake SVGs are
      # generated into an empty runner and never reach the repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Render profile picture as an LED panel
        run: |
          python scripts/avatar_dots.py \
            --user "$GH_USER" \
            --label "$GH_USER" \
            --grid 42 \
            --mode color \
            --out assets/avatar-dotmatrix.svg

      - name: Render stats, languages and highlights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats_cards.py --user "$GH_USER" --out-dir assets

      - name: Build the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Show what was generated
        run: ls -la assets

      # One commit for everything, rebased first so nothing gets rejected.
      - name: Commit everything in one push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: refresh profile animations"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
